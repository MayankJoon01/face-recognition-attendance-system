{% extends "base.html" %}{% block content %}
<div class="card login"><h2>Admin login</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<p><label>Username<br><input name="username" required autofocus style="width:100%"></label></p>
<p><label>Password<br><input type="password" name="password" required style="width:100%"></label></p>
<button>Sign in</button></form>
<p><a href="{{ url_for('student_login') }}">Student? Log in here</a></p>
<p class="muted">First run: <b>admin</b> / <b>admin123</b> (you'll be asked to change it).</p></div>
{% endblock %}
