{% extends "base.html" %}{% block content %}
<div class="card login"><h2>Change password</h2>
{% if session.must_change or session.s_must_change %}<p class="muted">You must set a new password before continuing.</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<p><label>New password (8+ characters)<br><input type="password" name="p1" required style="width:100%"></label></p>
<p><label>Repeat<br><input type="password" name="p2" required style="width:100%"></label></p>
<button>Save</button></form></div>
{% endblock %}
